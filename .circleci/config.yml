version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:24.15
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm run build
      - run: npm test

workflows:
  test:
    jobs:
      - test
