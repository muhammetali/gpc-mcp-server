image: node:24

stages:
  - test

# GitLab runs the tests; it does not publish.
#
# There used to be a `publish` stage here that ran `npm publish` on every
# `v*` tag — the same trigger GitHub Actions uses. Two systems publishing
# one package is a race with one winner: the second gets "You cannot publish
# over the previously published versions" and fails. That already happened
# on a sibling project the first time its tags were mirrored here.
#
# GitHub is where releases come from, because that is where the npm
# provenance attestation is generated — npm records that the tarball was
# built by a named workflow in a named repository, and a second publisher
# cannot produce that claim. This repository is a mirror; it verifies, it
# does not release.
test:
  stage: test
  script:
    - npm ci
    - npm run build
    - npm test
