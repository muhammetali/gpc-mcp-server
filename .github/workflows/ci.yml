name: CI

# Runs on every push to main and every pull request. Until this existed,
# nothing verified this package until a release tag was pushed — code
# reached main entirely unchecked, and the first thing to run the tests was
# the job that publishes to npm.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # An MCP server runs on whatever machine its user has. Node 20 is
        # the oldest still in maintenance; 24 is what the container image
        # uses. Both platforms because path handling and native modules are
        # where the differences show up.
        os: [ubuntu-latest, macos-latest]
        node: [20, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Production dependencies only: a dev-tool advisory that cannot reach
      # a consumer should not block a release, and treating it as if it can
      # trains everyone to ignore the whole check.
      - run: npm audit --omit=dev --audit-level=moderate

  # Releases are decided by reading commit messages, so a message that does
  # not parse is not a style problem — it is a commit that silently ships
  # nothing. Checking it in the pull request beats wondering later why main
  # stopped producing releases.
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit follows Conventional Commits
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: .+'
          bad=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in "Merge "*) continue ;; esac
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::not a conventional commit: $subject"
              bad=1
            fi
          done < <(git rev-list origin/${{ github.base_ref }}..HEAD)
          if [ "$bad" -ne 0 ]; then
            echo "Expected e.g. 'fix: handle an expired token' — the prefix decides"
            echo "whether a release happens and whether it is a patch or a minor."
            exit 1
          fi
